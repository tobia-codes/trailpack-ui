packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  # Needed for esbuild to link its platform binary during install.
  esbuild: true
minimumReleaseAgeExclude:
  - '@vanilla-extract/css@1.21.2'
  - '@vanilla-extract/vite-plugin@5.2.6'
  - '@storybook/builder-vite@10.5.5'
  - '@storybook/csf-plugin@10.5.5'
  - '@storybook/react-dom-shim@10.5.5'
  - '@storybook/react-vite@10.5.5'
  - '@storybook/react@10.5.5'
  - storybook@10.5.5
